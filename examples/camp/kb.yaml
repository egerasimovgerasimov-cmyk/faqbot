# Example knowledge base: a fictional kids' summer camp.
# Everything here is made up, but the questions mirror real ones from the
# production bot this project was extracted from.

bot:
  name: Солнышко
  greeting: >-
    Привет! Я «Солнышко» — бот лагеря «Солнечный». Спросите про путёвки,
    смены, документы или дорогу — отвечу по базе знаний.
  fallback: >-
    Не нашёл ответа на этот вопрос. Попробуйте переформулировать — или
    напишите оператору, он на связи с 10:00 до 18:00.
  threshold: 0.50
  clarify_gap: 0.06
  operator_label: Написать оператору
  operator_url: https://t.me/sunnycamp_bot
  replies:
    identity: >-
      Я «Солнышко» — бот лагеря «Солнечный». Отвечаю по базе знаний,
      а не выдумываю факты: если ответа нет, предложу написать оператору.
    capabilities: >-
      Могу рассказать про путёвки и цены, смены, документы, проживание,
      питание, оплату, дорогу, медицину и связь с ребёнком.
    human: >-
      Конечно, давайте свяжемся с человеком. Напишите в Telegram:
      https://t.me/sunnycamp_bot — отвечаем с 10:00 до 18:00.
    thanks: Рад помочь! Если появятся ещё вопросы — я рядом.
    goodbye: До встречи! Хорошего отдыха.

quick:
  - label: Сколько стоит путёвка?
    query: Сколько стоит путёвка?
  - label: Какие смены в 2026 году?
    query: Какие смены есть в 2026 году?
  - label: Какие документы нужны?
    query: Какие документы нужны для заезда?
  - label: Как добраться?
    query: Как добраться до лагеря?

synonyms:
  - "путёвка = тур, поездка, путевка, voucher"
  - "цена = стоимость, сколько стоит, прайс, тариф"
  - "смена = заезд, поток, смена"
  - "ребёнок = ребенок, сын, дочь, дети"
  - "документы = справка, бумаги, список документов"
  - "питание = еда, кормят, меню, столовая"
  - "телефон = мобильный, позвонить, связь"
  - "дорога = добраться, трансфер, автобус, как доехать"

qa:
  - question: Сколько стоит путёвка?
    answer: >-
      Стоимость зависит от смены: от 42 000 до 58 000 ₽ за 14 дней.
      В цену входят проживание, пятиразовое питание, программа, бассейн
      и круглосуточное медицинское сопровождение. Актуальные цены на 2026
      год присылает оператор.
    keywords: цена стоимость стоимость путёвки сколько стоит прайс деньги
    category: Путёвки
    priority: 10

  - question: Что входит в стоимость путёвки?
    answer: >-
      Проживание, пятиразовое питание, образовательная и развлекательная
      программа, бассейн, медицинское сопровождение и страховка. Дорога
      оплачивается отдельно, если вы не выбрали трансфер.
    keywords: входит включено состав услуги
    category: Путёвки
    priority: 6

  - question: Есть ли скидки на путёвку?
    answer: >-
      Да: 7% при раннем бронировании до 1 марта, 10% на второго ребёнка
      из одной семьи и 15% для сотрудников партнёрских организаций.
      Скидки не суммируются.
    keywords: скидка льгота акция дешевле
    category: Путёвки
    priority: 4

  - question: Можно ли вернуть деньги за путёвку?
    answer: >-
      Да. При отказе более чем за 30 дней до заезда возвращаем 100%,
      за 14–30 дней — 70%, менее чем за 14 дней — 50%. Заявление
      принимаем на почту info@sunnycamp.example.
    keywords: возврат отказ деньги вернуть отмена
    category: Путёвки
    priority: 3

  - question: Какие смены есть в 2026 году?
    answer: >-
      В 2026 году четыре смены: 1–14 июня, 17–30 июня, 3–16 июля и
      20 июля — 2 августа. Заезд в 10:00, выезд в 16:00.
    keywords: смены расписание даты 2026 лето заезд выезд время
    category: Смены
    priority: 9

  - question: Сколько длится смена?
    answer: Одна смена длится 14 дней, включая день заезда и день выезда.
    keywords: длительность сколько дней две недели
    category: Смены
    priority: 7

  - question: С какого возраста принимаете детей?
    answer: >-
      В лагерь принимаем детей от 7 до 17 лет. Отряды формируются по
      возрасту: 7–9, 10–12, 13–15 и 16–17 лет.
    keywords: возраст сколько лет отряд
    category: Смены
    priority: 8

  - question: Как забронировать путёвку?
    answer: >-
      Заполните форму на сайте, оператор подтвердит наличие места в течение
      дня. Бронь закрепляется после предоплаты 30%, остаток — не позднее
      чем за 10 дней до заезда.
    keywords: бронь бронирование заявка форма предоплата
    category: Бронирование
    priority: 9

  - question: Как оплатить путёвку?
    answer: >-
      Картой на сайте, банковским переводом по счёту или материнским
      капиталом. Для оплаты маткапиталом напишите на info@sunnycamp.example,
      подготовим договор и реквизиты.
    keywords: оплата карта перевод маткапитал реквизиты
    category: Оплата
    priority: 6

  - question: Какие документы нужны для заезда?
    answer: >-
      Нужны: свидетельство о рождении или паспорт, медицинская карта
      (форма 079/у), справка об отсутствии контактов с инфекционными
      больными, полис ДМС или ОМС, согласие на обработку данных и
      заявление от родителя. Полный список приходит на почту после брони.
    keywords: документы справка 079 список бумаги заезд страховка полис
    category: Документы
    priority: 10

  - question: Нужна ли медицинская справка?
    answer: >-
      Да, без формы 079/у и справки об отсутствии контактов ребёнка
      не заселят. Справки действуют три дня, поэтому оформляйте их
      непосредственно перед заездом.
    keywords: медсправка 079 врач здоровье
    category: Документы
    priority: 7

  - question: Можно ли привезти ребёнка позже начала смены?
    answer: >-
      Да, по согласованию с администратором. Напишите оператору не позднее
      чем за два дня, мы предупредим отряд и организуем встречу.
    keywords: позже опоздание привезти заехать
    category: Документы
    priority: 2

  - question: Как добраться до лагеря?
    answer: >-
      Организованный трансфер отправляется от железнодорожного вокзала
      в 8:30. На машине — 25 км по трассе, на КПП нужен пропуск,
      его выписывают по заявке. Точный адрес и схему проезда присылает
      оператор.
    keywords: добраться трансфер автобус адрес дорога проезд
    category: Дорога
    priority: 8

  - question: Можно ли приехать на своей машине?
    answer: >-
      Да, на территории есть парковка для родителей. Въезд по пропуску,
      который оформляется за день до визита. Машины на территорию лагеря
      не заезжают — оставляйте на парковке у КПП.
    keywords: машина авто парковка проезд
    category: Дорога
    priority: 3

  - question: Где живут дети?
    answer: >-
      В четырёх корпусах по 4–6 человек в комнате. В каждом корпусе есть
      санузел, душевые и комната отдыха, корпуса делятся по отрядам.
    keywords: проживание корпус комната живут размещение сколько человек в комнате
    category: Проживание
    priority: 6

  - question: Как кормят детей?
    answer: >-
      Пятиразовое питание: завтрак, обед, полдник, ужин и второй ужин.
      Если у ребёнка аллергия или диета — укажите это в анкете, повара
      готовят отдельно.
    keywords: питание еда меню кормят аллергия диета столовая
    category: Проживание
    priority: 7

  - question: Есть ли бассейн?
    answer: >-
      Да, в лагере есть открытый бассейн. Купание проходит по расписанию
      с инструктором и врачом, глубина в детской зоне — 1,2 метра.
    keywords: бассейн купание плавание вода
    category: Проживание
    priority: 3

  - question: Можно ли звонить ребёнку?
    answer: >-
      Да, вожатый выдаёт телефон на связи с 19:00 до 20:30. Номер отряда
      и вожатого приходит в первый день смены. В экстренных случаях
      звоните в администрацию круглосуточно.
    keywords: звонить телефон связь позвонить ребёнку
    category: Связь
    priority: 8

  - question: Есть ли в лагере интернет и можно ли брать телефон?
    answer: >-
      Телефон можно, но во время мероприятий он хранится у вожатого.
      Wi-Fi есть в корпусах и на территории, скорость достаточна для
      видеозвонков.
    keywords: интернет wifi телефон гаджеты связь
    category: Связь
    priority: 4

  - question: Кто следит за здоровьем детей?
    answer: >-
      В лагере круглосуточно дежурят врач и медсестра, есть медпункт
      с изолятором. Лекарства принимаются только по назначению врача
      и с письменного согласия родителя.
    keywords: здоровье врач медпункт медицина лекарства
    category: Медицина
    priority: 6

  - question: Что делать, если ребёнок заболел в лагере?
    answer: >-
      Врач осматривает ребёнка и при необходимости помещает в изолятор.
      Родителям звонят в тот же день, при температуре или инфекции
      ребёнка забирают домой. Страховка покрывает вызов врача.
    keywords: заболел заболеет болеет болезнь температура изолятор
    category: Медицина
    priority: 5

  - question: Что взять с собой в лагерь?
    answer: >-
      Список: одежда по погоде, спортивная форма, купальник, головной убор,
      закрытая обувь, средства гигиены, полотенце, кружка, лекарства
      с назначением врача. Полный чек-лист приходит после бронирования.
    keywords: взять список вещи чек-лист собрать
    category: Родителям
    priority: 5

  - question: Можно ли передать ребёнку посылку?
    answer: >-
      Да, передачи принимают на КПП с 10:00 до 18:00. Продукты, газировку
      и скоропортящиеся продукты передавать нельзя, вещи и книги — можно.
    keywords: посылка передача передать гостинец
    category: Родителям
    priority: 3

  - question: Можно ли попасть в один отряд с другом?
    answer: >-
      Постараемся: укажите имя друга в заявке или напишите оператору
      до распределения отрядов. Гарантировать место рядом не можем,
      если разница в возрасте больше двух лет.
    keywords: отряд друг вместе друзья
    category: Родителям
    priority: 2

  - question: Как связаться с администрацией?
    answer: >-
      Telegram: https://t.me/sunnycamp_bot, телефон: +7 (900) 000-00-00,
      почта: info@sunnycamp.example. Офис работает по будням с 10:00
      до 18:00, в сезон — ежедневно.
    keywords: связаться контакты администрация телефон почта
    category: Контакты
    priority: 9
