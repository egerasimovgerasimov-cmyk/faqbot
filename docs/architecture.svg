<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">faqbot architecture</title>
  <desc id="desc">A visitor talks to the web widget or the Telegram adapter. Both call the same pure-Python engine, which scores the question against one YAML knowledge base. Unanswered questions and feedback are appended to JSONL logs used to improve the knowledge base.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a2b3"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.5; }
      .tint { fill: #f2f4f7; stroke: #d0d5dd; stroke-width: 1.5; }
      .accent { fill: #eef4ff; stroke: #2f6fed; stroke-width: 1.5; }
      .dashed { fill: #fbfcfd; stroke: #98a2b3; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .h { font: 600 15px/1.2 -apple-system, "Segoe UI", Roboto, sans-serif; fill: #101828; }
      .b { font: 13px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; fill: #475467; }
      .m { font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #667085; }
      .flow { stroke: #98a2b3; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-dash { stroke: #98a2b3; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="900" height="340" fill="#fbfcfd"/>

  <!-- input -->
  <rect class="tint" x="24" y="30" width="180" height="104" rx="12"/>
  <text class="h" x="44" y="60">Visitor</text>
  <text class="b" x="44" y="84">Website widget</text>
  <text class="b" x="44" y="104">Telegram bot</text>
  <text class="m" x="44" y="123">one question</text>

  <!-- transports -->
  <rect class="box" x="248" y="30" width="180" height="104" rx="12"/>
  <text class="h" x="268" y="60">Transports</text>
  <text class="m" x="268" y="84">widget.js → HTTP</text>
  <text class="m" x="268" y="104">telegram.py → aiogram</text>
  <text class="b" x="268" y="123">sessions, buttons</text>

  <!-- engine -->
  <rect class="accent" x="472" y="18" width="196" height="128" rx="12"/>
  <text class="h" x="492" y="48">Engine</text>
  <text class="m" x="492" y="70">normalize → stem</text>
  <text class="m" x="492" y="89">synonyms → IDF</text>
  <text class="m" x="492" y="108">score → threshold</text>
  <text class="b" x="492" y="130">pure Python, no network</text>

  <!-- kb -->
  <rect class="tint" x="712" y="30" width="164" height="104" rx="12"/>
  <text class="h" x="732" y="60">Knowledge base</text>
  <text class="m" x="732" y="84">kb.yaml</text>
  <text class="b" x="732" y="104">questions, answers,</text>
  <text class="b" x="732" y="122">synonyms, priorities</text>

  <!-- answer -->
  <rect class="box" x="248" y="196" width="180" height="86" rx="12"/>
  <text class="h" x="268" y="226">Answer</text>
  <text class="b" x="268" y="248">answer · clarify</text>
  <text class="b" x="268" y="266">fallback · quick replies</text>

  <!-- logs -->
  <rect class="dashed" x="472" y="196" width="196" height="86" rx="12"/>
  <text class="h" x="492" y="226">Improvement loop</text>
  <text class="m" x="492" y="248">unanswered.jsonl</text>
  <text class="m" x="492" y="266">feedback.jsonl</text>

  <!-- arrows -->
  <path class="flow" d="M204 82 H240"/>
  <path class="flow" d="M428 82 H464"/>
  <path class="flow" d="M668 82 H704"/>
  <path class="flow" d="M572 146 V160 Q572 172 560 172 H352 Q338 172 338 184 V190"/>
  <path class="flow-dash" d="M338 282 V300 Q338 312 352 312 H656 Q668 312 668 300 V288"/>

  <!-- captions -->
  <text class="b" x="24" y="324">The matcher is a pure function: the same question always gets the same score, so answers can be tested and debugged.</text>
</svg>
